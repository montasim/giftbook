<!doctype html>
<!-- সোশ্যাল প্রিভিউ টেমপ্লেট (1200×630) → bash brand/render.sh → public/og-v2.png
     লোগো+নাম মাঝের 630×630 অংশে রাখা, যাতে WhatsApp/Messenger-এর বর্গাকার থাম্বনেইলেও লোগো কাটা না পড়ে -->
<html lang="bn">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../node_modules/@fontsource/hind-siliguri/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/hind-siliguri/600.css">
<link rel="stylesheet" href="../node_modules/@fontsource/hind-siliguri/700.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: "Hind Siliguri", system-ui, sans-serif; color: #1c1917; position: relative;
         background: #fafaf9 radial-gradient(900px 500px at 50% 0%, #d1fae5 0%, rgba(209,250,229,0) 70%); }
  .bar { position: absolute; left: 0; right: 0; top: 0; height: 14px; background: linear-gradient(90deg, #059669, #065f46); }
  .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: 0 80px; text-align: center; }
  .logo { width: 150px; height: 150px; filter: drop-shadow(0 18px 30px rgba(6,78,59,.28)); }
  h1 { margin-top: 26px; font-size: 84px; font-weight: 700; line-height: 1; letter-spacing: -0.5px; color: #064e3b; }
  .tag { margin-top: 22px; font-size: 38px; font-weight: 600; line-height: 1.25; color: #292524; }
  .sub { margin-top: 10px; font-size: 26px; line-height: 1.4; color: #57534e; max-width: 980px; }
  .wrap { padding-bottom: 30px; }
  .chips { margin-top: 26px; display: flex; gap: 12px; justify-content: center; }
  .chip { font-size: 22px; font-weight: 600; color: #065f46; background: #ecfdf5; border: 1.5px solid #a7f3d0; border-radius: 999px; padding: 6px 18px; }
  .url { position: absolute; left: 0; right: 0; bottom: 24px; text-align: center; font-size: 22px; font-weight: 600; color: #047857; letter-spacing: .2px; }
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="wrap">
    <img class="logo" src="../public/logo.svg" alt="">
    <h1>উপহারের খাতা</h1>
    <div class="tag">পরিবারের উপহারের হিসাব, এক জায়গায়</div>
    <div class="sub">বিয়ে, আকিকা, জন্মদিন — কে কী দিল, কাকে কী দিলাম।<br>খাতা থাকে আপনার নিজের Google Sheet-এ, অ্যাপ চলে ফোনে।</div>
    <div class="chips"><span class="chip">অফলাইনেও চলে</span><span class="chip">QR দিয়ে শেয়ার</span><span class="chip">এক্সেল ও প্রিন্ট</span><span class="chip">বিনামূল্যে</span></div>
  </div>
  <div class="url">giftbook.netlify.app</div>
</body>
</html>
