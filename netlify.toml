[build]
  # Remote build: secrets Infisical থেকে (machine identity, universal auth)।
  # Netlify env-এ লাগে: INFISICAL_PROJECT_ID (public), INFISICAL_UNIVERSAL_AUTH_CLIENT_ID, INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET (secret)।
  # লোকাল ম্যানুয়াল ডিপ্লয়ে এটা চলে না: pnpm deploy (= infisical run --env=prod -- vite build → netlify deploy --no-build)।
  command = "npm i -g @infisical/cli && export INFISICAL_TOKEN=$(infisical login --method=universal-auth --silent --plain) && infisical run --projectId=$INFISICAL_PROJECT_ID --env=prod --silent -- pnpm build"
  publish = "dist/client"

# পরিচিত রুট → SPA shell (200)। আসল ফাইল (assets, png, svg…) থাকলে redirect হয় না।
[[redirects]]
  from = "/"
  to = "/_shell.html"
  status = 200

[[redirects]]
  from = "/welcome"
  to = "/_shell.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/_shell.html"
  status = 200

[[redirects]]
  from = "/setup"
  to = "/_shell.html"
  status = 200

[[redirects]]
  from = "/join"
  to = "/_shell.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/_shell.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/_shell.html"
  status = 200

[[redirects]]
  from = "/share"
  to = "/_shell.html"
  status = 200

[[redirects]]
  from = "/settings"
  to = "/_shell.html"
  status = 200

[[redirects]]
  from = "/people"
  to = "/_shell.html"
  status = 200

[[redirects]]
  from = "/people/*"
  to = "/_shell.html"
  status = 200

[[redirects]]
  from = "/events/*"
  to = "/_shell.html"
  status = 200

# বাকি সব অজানা পাথ: একই SPA shell, কিন্তু আসল HTTP 404 (অ্যাপ 404 পাতা দেখায়, ক্রলারও 404 পায়)
[[redirects]]
  from = "/*"
  to = "/_shell.html"
  status = 404
